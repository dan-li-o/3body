</style></head><body><main>
<p class="ul-invite">Add molecules. Watch the piston, the pointer and the pen.</p>
<div class="fig">
 <div><canvas id="model" role="img" aria-label="A gas chamber. Molecules fly inside; the right wall is a piston on a spring; a pointer shows the push per molecule."></canvas></div>
 <div><canvas id="chart" role="img" aria-label="The pointer's reading traced as molecules are added."></canvas>
  <div class="key" hidden><span><i id="k1"></i>inner band: the pointer is here about 68% of the time</span><span><i id="k2"></i>outer band: about 95%</span></div></div>
</div>

 <button class="ul-btn" data-a="add">Add a molecule</button>

</div>

</main>
<script>// Gas-chamber engine (Ch1 §5b The Pressure Gauge). Pure math, no drawing.
// A two-dimensional ideal gas: point molecules that do not collide with each other.
// - Speeds follow the Maxwell–Boltzmann distribution (each velocity component normal, spread SIGMA).
// - Top and bottom walls reflect molecules unchanged.
// - Left wall is held at one temperature: a molecule that hits it leaves with a fresh thermal velocity
//   (flux-weighted, as for a real wall: normal component Rayleigh, sideways component normal).
// - Right wall is a heavy piston on a stiff, damped spring. Molecules bounce off it elastically and every
//   bounce's impulse is added up: that is the push on the piston.
// Units are arbitrary: molecule mass 1, SIGMA = 1.5. The push per molecule averages SIGMA² / L
// (the ideal-gas law, P·V = N·k·T, in these units); MEAN below is checked against the simulation in the tests.
const SIGMA = 1.5;
function createGas(o = {}) {
  const cap = o.cap ?? 10000, L = o.L ?? 2;
  return { L, H: o.H ?? 1, M: o.M ?? 2000, k: o.k ?? 2e6, c: o.c ?? 38000, x0: L, px: L, pv: 0,
    n: 0, x: new Float64Array(cap), y: new Float64Array(cap), vx: new Float64Array(cap), vy: new Float64Array(cap),
    impulse: 0, t: 0, rate: 0 };
}
function gauss(rng) { return Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(2 * Math.PI * rng()); }
function addBall(g, rng) {
  if (g.n >= g.x.length) return;
  const i = g.n++; g.x[i] = rng() * (g.px - 0.02) + 0.01; g.y[i] = rng() * g.H;
  g.vx[i] = SIGMA * gauss(rng); g.vy[i] = SIGMA * gauss(rng);
}
function step(g, dt, rng, sub = 4) {
  const h = dt / sub, H = g.H, M = g.M, X = g.x, Y = g.y, VX = g.vx, VY = g.vy;
  let imp = 0;
  for (let s = 0; s < sub; s++) {
    const px = g.px; let pv = g.pv;
    for (let i = 0; i < g.n; i++) {
      let x = X[i] + VX[i] * h, y = Y[i] + VY[i] * h;
      if (y < 0) { y = -y; VY[i] = -VY[i]; } else if (y > H) { y = 2 * H - y; VY[i] = -VY[i]; }
      if (x < 0) { x = -x; VX[i] = SIGMA * Math.sqrt(-2 * Math.log(1 - rng())); VY[i] = SIGMA * gauss(rng); }
      else if (x > px && VX[i] > pv) {
        const u1 = VX[i], v1 = ((1 - M) * u1 + 2 * M * pv) / (1 + M), v2 = ((M - 1) * pv + 2 * u1) / (1 + M);
        imp += M * (v2 - pv); pv = v2; VX[i] = v1; x = px - (x - px);
      }
      X[i] = x; Y[i] = y;
    }
    pv += ((-g.k * (g.px - g.x0) - g.c * pv) / M) * h; g.px += pv * h; g.pv = pv; g.t += h;
  }
  g.impulse += imp;
  return imp;
}
// The dial: push over the last fraction of a second (an exponential average with time constant TAU), per molecule.
const TAU = 0.25;
function updateDial(g, imp, dt) { g.rate += (imp / dt - g.rate) * Math.min(1, dt / TAU); return g.n ? g.rate / g.n : 0; }
const MEAN = SIGMA * SIGMA / 2;   // ideal-gas value for L = 2: SIGMA² / L

// Molecules beyond those simulated one by one. Molecules in an ideal gas don't interact, so the push from many of them is
// the sum of many independent pushes. Each molecule hits the piston at an average rate RATE = SIGMA / (√(2π)·L);
// each hit gives an impulse 2·vx, with vx drawn as at a real wall (Rayleigh, spread SIGMA). So the push from m
// unsimulated molecules over dt is a compound Poisson sum: a Poisson number of hits, each with its own impulse.
// The tests check that this gives the same dial as simulating every molecule.
const RATE = SIGMA / (Math.sqrt(2 * Math.PI) * 2);
function poisson(mu, rng) {
  if (mu > 30) return Math.max(0, Math.round(mu + Math.sqrt(mu) * gauss(rng)));
  let k = 0, p = Math.exp(-mu), s = p, u = rng(); while (u > s) { k++; p *= mu / k; s += p; } return k;
}
function statImpulse(m, dt, rng) {
  const k = poisson(m * RATE * dt, rng); let imp = 0;
  if (k > 60) { // many hits: the sum is normal, with mean k·E[J] and variance k·Var[J]; E[J] = 2σ√(π/2), E[J²] = 8σ²
    const EJ = 2 * SIGMA * Math.sqrt(Math.PI / 2), VJ = 8 * SIGMA * SIGMA - EJ * EJ;
    return k * EJ + Math.sqrt(k * VJ) * gauss(rng);
  }
  for (let i = 0; i < k; i++) imp += 2 * SIGMA * Math.sqrt(-2 * Math.log(1 - rng()));
  return imp;
}

// Expected range of the dial, measured once by simulating at each count (tools/calibrate-gas.mjs):
// [molecules, mean, 2.5%, 16%, 84%, 97.5%]. Inner band (16–84%): about 68 of every 100 moments; outer (2.5–97.5%): about 95.
const CALIB = [[1, 0.9327, 0, 0, 1.026, 9.6078], [2, 1.154, 0, 0, 2.4283, 8.3095], [3, 1.1998, 0.0001, 0.0101, 2.6393, 6.7736], [5, 1.1077, 0.002, 0.047, 2.3032, 4.9633], [10, 1.1511, 0.0345, 0.2225, 2.1207, 3.6769], [20, 1.0586, 0.1122, 0.3919, 1.7404, 2.663], [50, 1.1414, 0.3903, 0.6935, 1.5765, 2.1386], [100, 1.1103, 0.5654, 0.7937, 1.4151, 1.8127], [200, 1.1315, 0.7165, 0.9161, 1.3546, 1.5964], [500, 1.111, 0.8586, 0.9802, 1.2498, 1.3875], [1000, 1.1257, 0.9326, 1.0167, 1.2246, 1.3399], [2000, 1.1226, 0.9933, 1.0577, 1.1842, 1.2528], [5000, 1.1071, 1.0243, 1.0659, 1.1489, 1.1918], [10000, 1.0981, 1.037, 1.0682, 1.1293, 1.1578]];
function bandAt(n, k) {
  const C = CALIB, lo = k === 1 ? 3 : 2, hi = k === 1 ? 4 : 5;
  if (n <= C[0][0]) return [C[0][lo], C[0][hi]];
  for (let i = 1; i < C.length; i++) if (n <= C[i][0]) {
    const t = (Math.log(n) - Math.log(C[i - 1][0])) / (Math.log(C[i][0]) - Math.log(C[i - 1][0]));
    return [C[i - 1][lo] + t * (C[i][lo] - C[i - 1][lo]), C[i - 1][hi] + t * (C[i][hi] - C[i - 1][hi])];
  }
  const L = C[C.length - 1]; return [L[lo], L[hi]];
}
</script>
<script>
(()=>{
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mc=document.getElementById('model'),cc=document.getElementById('chart'),mx=mc.getContext('2d'),cx=cc.getContext('2d');
const statusEl=document.querySelector('.ul-status'),valsEl=document.getElementById('vals'),key=document.querySelector('.key');
const btn=a=>document.querySelector(`[data-a=${a}]`);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=(Date.now()%2147483646)+1;const rng=()=>(seed=seed*16807%2147483647)/2147483647;
const MAX=10000,SIM=400,RUN_S=22,YMAX=MEAN*2.4,DRAWN=400,NICE=[10,100,1000,10000],STEP_UNTIL=3;
const SAY={
 start:'An empty chamber. Add a molecule.',
 one:'One molecule. Each time it hits the piston, the pointer jumps; between hits it falls back to zero. A knock, then nothing.',
 two:'The line traces the pointer: across for how many molecules, up for the push per molecule. Add another.',
 ready:'You get the idea. Add molecules one at a time, or let it run.',
 running:'More and more molecules. Watch the piston, the pointer and the pen: the knocks become a hum. That hum is pressure.',
 run1:'Few molecules: the push comes in knocks. Thousands: one steady push. That steady push is pressure. Does the math predict this shape?',
 runN:'A new run, the same shape. Each knock is random; the hum is lawful.',
 band:'The pressure was predictable all along. The bands were worked out in advance, from long simulations at each count: the pointer spends about 68% of the time in the inner band, about 95% in the outer. Both narrow as molecules are added.'};
let N=0,rate=0,nAvg=0,dispV=0,dispVel=0,g,trace,old,runs,mode,showBand,say,xMax,bandT0,dialV,run,raf=0,lastT=0,onScreen=true;
function reset(){N=0;rate=0;nAvg=0;dispV=0;dispVel=0;g=createGas({cap:SIM});trace=[];old=[];runs=0;mode='idle';showBand=false;say=SAY.start;xMax=10;bandT0=0;dialV=0;run=null;
 btn('add').hidden=false;btn('run').hidden=true;btn('band').hidden=true;key.hidden=true;btn('run').textContent='Run: up to 10,000 molecules';loop();}
function zoomTo(to){const from=xMax,t0=performance.now();if(reduced||from===to){xMax=to;return;}
 const z=now=>{const p=Math.min(1,(now-t0)/800),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;xMax=from+(to-from)*e;if(p<1)requestAnimationFrame(z);else xMax=to;};requestAnimationFrame(z);}
function grow(n){N=Math.max(N,n);while(g.n<Math.min(N,SIM))addBall(g,rng);const to=NICE.find(v=>v>=N)||MAX;if(to>xMax)zoomTo(to);}
document.querySelector('.ul-controls').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
 if(a==='add'&&mode==='idle'){grow(N+1);say=N===1?SAY.one:N===2?SAY.two:N>=STEP_UNTIL?SAY.ready:say;if(N>=STEP_UNTIL)btn('run').hidden=false;}
 if(a==='run'&&mode==='idle'){if(runs>0){old.push(trace);g=createGas({cap:SIM});N=0;rate=0;nAvg=0;trace=[];xMax=10;}if(!N)grow(1);
  mode='run';run={t0:performance.now(),t:0,n0:N};say=SAY.running;btn('add').hidden=true;btn('run').disabled=true;}
 if(a==='band'){showBand=true;bandT0=performance.now();btn('band').hidden=true;key.hidden=false;say=SAY.band;}
 if(a==='reset')reset();
 loop();});
function endRun(){const t=trace,k=Math.floor(t.length/2*2/3)*2;let s=0,c=0;for(let i=k+1;i<t.length;i+=2){s+=t[i];c++;}window.__late=s/c/MEAN;mode='idle';runs++;run=null;btn('run').disabled=false;btn('run').textContent='Run again';say=runs===1?SAY.run1:SAY.runN;if(!showBand)btn('band').hidden=false;}
function loop(){if(!raf&&onScreen&&!document.hidden){lastT=performance.now();raf=requestAnimationFrame(frame);}}
new IntersectionObserver(es=>{onScreen=es[0].isIntersecting;if(onScreen)loop();}).observe(mc);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loop();});
function frame(now){raf=0;const dt=Math.min(1/30,Math.max(1/240,(now-lastT)/1000));lastT=now;
 if(run){run.t=(now-run.t0)/1000;const p=Math.min(1,run.t/RUN_S);grow(Math.round(run.n0*Math.pow(MAX/run.n0,p)));}
 if(N){// molecules drawn on screen are simulated one by one; the rest are added by the tested statistical model
  const imp=step(g,dt,rng)+statImpulse(N-g.n,dt,rng);const a=Math.min(1,dt/TAU);rate+=(imp/dt-rate)*a;nAvg+=(N-nAvg)*a;dialV=rate/nAvg;
  {const w=2*Math.PI*4,z=0.45;dispVel+=(w*w*(Math.min(dialV,YMAX)-dispV)-2*z*w*dispVel)*dt;dispV+=dispVel*dt;if(reduced){dispV=dialV;dispVel=0;}}
  if(mode==='run'||trace.length<4000)trace.push(N,dialV);}
 if(run&&run.t>=RUN_S)endRun();
 draw(now);if(N)loop();}
// Layout. One value axis (push per molecule) is shared by the piston, the pointer and the pen.
// Wide: the push runs upward; the piston's height IS the chart's height for that push.
// Phone: everything turns 90°: the push runs left to right; the piston slides sideways above the chart,
// and the line grows downward as molecules are added.
let A={};
function layout(){const dpr=Math.min(2,devicePixelRatio||1),phone=true;   // stacked on every screen, like the coin
 const W1=mc.clientWidth,W2=cc.clientWidth;
 const H1=Math.round(Math.min(W1*0.3,170)),H2=Math.round(Math.min(W2*0.75,420));
 for(const[c,ctx,w,h]of[[mc,mx,W1,H1],[cc,cx,W2,H2]]){c.style.height=h+'px';c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);c._w=w;c._h=h;}
 A=phone?{phone,v0:Math.round(W1*0.34),v1:Math.round(W1*0.86)}:{phone,v0:Math.round(H1*0.72),v1:70};
 draw(performance.now());}
const V=v=>A.v0+Math.min(v,YMAX)/YMAX*(A.v1-A.v0);
function draw(now){drawModel();drawChart(now);if(statusEl.textContent!==say)statusEl.textContent=say;
 valsEl.textContent=`${N.toLocaleString()} molecules. Push per molecule now ${dialV.toFixed(2)}; the ideal-gas value is ${MEAN.toFixed(2)}.`;}
function drawModel(){const W=mc._w,H=mc._h,ink=css('--ul-ink'),grey=css('--ul-grey'),rule=css('--ul-rule'),acc=css('--ul-accent');mx.clearRect(0,0,W,H);
 const p=V(dialV),r=g.n>100?1.6:2.6;mx.lineCap='round';
 if(!A.phone){const left=6,right=W-6,floor=H-24,post=14;
  mx.strokeStyle=rule;mx.lineWidth=1.75;mx.beginPath();mx.moveTo(left,p-2);mx.lineTo(left,floor);mx.lineTo(right,floor);mx.lineTo(right,p-2);mx.stroke();
  const s=(floor-p)/g.x0,hs=(right-left)/g.H;mx.fillStyle=ink;
  for(let i=0;i<g.n;i++){mx.beginPath();mx.arc(left+g.y[i]*hs,floor-Math.min(g.x[i],g.x0)*s,r,0,7);mx.fill();}
  const c=(left+right)/2;spring(c,p,c,post,grey,rule);
  mx.strokeStyle=acc;mx.lineWidth=3;mx.beginPath();mx.moveTo(left,p);mx.lineTo(right,p);mx.stroke();
  guide(right,p,W,p);}
 else{// a fixed chamber (left wall to the zero mark); the piston slides in a short sleeve beyond it
  const left=6,top=24,bot=H-6,post=W-6,wall=A.v0,pp=Math.max(wall,V(dispV));
  mx.strokeStyle=rule;mx.lineWidth=1.75;mx.beginPath();mx.moveTo(wall,top);mx.lineTo(left,top);mx.lineTo(left,bot);mx.lineTo(wall,bot);mx.stroke();
  mx.lineWidth=1;mx.beginPath();mx.moveTo(wall,top);mx.lineTo(Math.min(post-30,A.v1+12),top);mx.moveTo(wall,bot);mx.lineTo(Math.min(post-30,A.v1+12),bot);mx.stroke();
  const s=(wall-left-4)/g.x0,hs=(bot-top)/g.H;mx.fillStyle=ink;
  for(let i=0;i<g.n;i++){mx.beginPath();mx.arc(left+2+Math.min(g.x[i],g.x0)*s,bot-g.y[i]*hs,r,0,7);mx.fill();}
  const c=(top+bot)/2;spring(pp,c,post,c,grey,rule);
  mx.strokeStyle=acc;mx.lineWidth=3;mx.beginPath();mx.moveTo(pp,top+2);mx.lineTo(pp,bot-2);mx.stroke();
  guide(pp,bot,pp,H);}
 mx.font='italic 14px '+css('--ul-serif');mx.fillStyle=grey;mx.textBaseline='alphabetic';mx.textAlign='left';
 mx.fillText(N>SIM?`${N.toLocaleString()} molecules (${SIM} drawn)`:`${N} molecule${N===1?'':'s'}`,6,A.phone?15:H-6);}
function spring(x1,y1,x2,y2,grey,rule){const n=12,amp=7,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
 mx.strokeStyle=grey;mx.lineWidth=1.25;mx.beginPath();mx.moveTo(x1,y1);
 for(let i=1;i<=n;i++){const t=i/(n+1),k=i%2?amp:-amp;mx.lineTo(x1+dx*t+nx*k,y1+dy*t+ny*k);}mx.lineTo(x2,y2);mx.stroke();
 mx.strokeStyle=rule;mx.lineWidth=1.75;mx.beginPath();mx.moveTo(x2-nx*26,y2-ny*26);mx.lineTo(x2+nx*26,y2+ny*26);mx.stroke();}
function guide(x1,y1,x2,y2){mx.strokeStyle=css('--ul-accent');mx.globalAlpha=.35;mx.lineWidth=1;mx.setLineDash([2,4]);mx.beginPath();mx.moveTo(x1,y1);mx.lineTo(x2,y2);mx.stroke();mx.setLineDash([]);mx.globalAlpha=1;}
function drawChart(now){const W=cc._w,H=cc._h,grey=css('--ul-grey'),ghost=css('--ul-ghost'),rule=css('--ul-rule'),acc=css('--ul-accent');cx.clearRect(0,0,W,H);
 let P,c0,c1;
 if(!A.phone){c0=44;c1=W-10;P=(n,v)=>[c0+(n-1)/(xMax-1)*(c1-c0),V(v)];}
 else{c0=26;c1=H-30;P=(n,v)=>[V(v),c0+(n-1)/(xMax-1)*(c1-c0)];}
 const bx=[];for(let i=0;i<=200;i++)bx.push(1+(xMax-1)*i/200);
 const poly=(k,e)=>bx.map(n=>P(n,bandAt(n,k)[e]));
 if(showBand){const fade=reduced?1:Math.min(1,(now-bandT0)/900);
  for(const[k,a]of[[2,.22],[1,.4]]){cx.fillStyle=ghost;cx.globalAlpha=a*fade;cx.beginPath();
   [...poly(k,1),...poly(k,0).reverse()].forEach((q,i)=>i?cx.lineTo(...q):cx.moveTo(...q));cx.closePath();cx.fill();}cx.globalAlpha=1;}
 cx.strokeStyle=rule;cx.lineWidth=1;cx.beginPath();cx.moveTo(...P(1,YMAX));cx.lineTo(...P(1,0));cx.lineTo(...P(xMax,0));cx.stroke();
 cx.strokeStyle=ghost;cx.lineWidth=1.25;cx.beginPath();cx.moveTo(...P(1,MEAN));cx.lineTo(...P(xMax,MEAN));cx.stroke();
 cx.font='italic 15px '+css('--ul-serif');cx.fillStyle=grey;
 if(!A.phone){cx.textBaseline='middle';cx.textAlign='right';cx.fillText('0',c0-14,V(0));cx.fillText('avg',c0-14,V(MEAN));
  cx.textAlign='left';cx.textBaseline='alphabetic';cx.fillText('push per molecule',c0,V(YMAX)-10);
  const yl=V(0)+22;cx.fillText('1',c0,yl);cx.textAlign='center';cx.fillText(Math.round(xMax/2).toLocaleString(),(c0+c1)/2,yl);cx.textAlign='right';cx.fillText(Math.round(xMax).toLocaleString()+' molecules',c1,yl);}
 else{cx.textBaseline='alphabetic';cx.textAlign='center';cx.fillText('0',V(0),c0-12);cx.fillText('avg',V(MEAN),c0-12);
  cx.textAlign='right';cx.textBaseline='middle';cx.fillText('1',V(0)-8,c0);cx.fillText(Math.round(xMax/2).toLocaleString(),V(0)-8,(c0+c1)/2);cx.fillText(Math.round(xMax).toLocaleString(),V(0)-8,c1);
  cx.textBaseline='alphabetic';cx.fillText('molecules',V(0)-8,c1+22);cx.fillText('push per molecule →',W-6,H-4);}
