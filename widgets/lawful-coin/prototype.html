<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Lawful Coin — prototype v2</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ul-paper:#fffff8;--ul-ink:#111111;--ul-grey:#5f646a;--ul-ghost:#a3a8ad;--ul-rule:#d3d6d1;--ul-accent:#b4501a;--ul-line:1.75;--ul-trail:.55;
 --ul-serif:'EB Garamond',Garamond,Georgia,serif;--ul-sans:'Source Sans 3',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--ul-paper:#151513;--ul-ink:#e8e6de;--ul-grey:#a9aeb4;--ul-ghost:#6f757c;--ul-rule:#474c52;--ul-accent:#f08a4b}}
body{margin:0;background:var(--ul-paper);color:var(--ul-ink);font-family:var(--ul-serif);font-size:19px}
main{max-width:780px;margin:0 auto;padding:22px 16px}
.ul-invite{font-style:italic;margin:0 0 .5rem}
.ul-status{font-style:italic;min-height:3em;margin:.5rem 0 .25rem}
canvas{display:block;width:100%}
.fig{display:flex;gap:28px;align-items:stretch}
.fig>div{flex:1 1 0;min-width:0}
@media(max-width:640px){.fig{flex-direction:column;gap:6px}}
canvas:focus-visible{outline:2px solid var(--ul-accent);outline-offset:4px}
.ul-controls{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-top:.5rem;font-family:var(--ul-sans);font-size:1rem}
.ul-btn{min-height:44px;min-width:44px;padding:0 1rem;font:inherit;font-family:var(--ul-sans);color:var(--ul-ink);background:transparent;border:1.5px solid currentColor;border-radius:6px;cursor:pointer}
.ul-btn[aria-pressed="true"]{background:var(--ul-ink);color:var(--ul-paper)}
.ul-btn-quiet{border-color:transparent;text-decoration:underline;text-underline-offset:.2em;padding:0 .5rem}
.ul-btn[hidden]{display:none}
.ul-btn:focus-visible{outline:2px solid var(--ul-accent);outline-offset:3px}
.sr{position:absolute;left:-9999px}
.key{display:flex;gap:.2rem 1.2rem;flex-wrap:wrap;font-family:var(--ul-sans);font-size:.85rem;color:var(--ul-grey);margin:.2rem 0 0 40px}
.key span{display:inline-flex;align-items:center;gap:.4rem}.key i{display:inline-block;width:14px;height:10px}
.key[hidden]{display:none}
</style></head><body><main>
<p class="ul-invite">Flip a coin. Then flip many.</p>
<div class="fig">
 <div><canvas id="model" role="img" aria-label="The coins of the latest flip, sorted into heads (filled) and tails (open)."></canvas></div>
 <div><canvas id="chart" role="img" aria-label="Share of heads against number of coins. One dot per flip."></canvas>
  <div class="key" hidden><span><i id="k1"></i>about 68 of every 100 flips</span><span><i id="k2"></i>about 95 of every 100</span></div></div>
</div>
<p class="ul-status" aria-live="polite"></p>
<div class="ul-controls">
 <button class="ul-btn" data-a="one">Flip one coin</button>
 <button class="ul-btn" data-a="add" hidden>Add a coin and flip</button>
 <button class="ul-btn" data-a="run" hidden>Run</button>
 <button class="ul-btn ul-btn-quiet" data-a="band" hidden>Show the expected range</button>
 <button class="ul-btn ul-btn-quiet" data-a="reset">Reset</button>
</div>
<p class="sr" id="vals"></p>
</main>
<script>// Coins engine (Ch1 §5a The Lawful Coin). Fair coins; no drawing.
// Flip n fair coins: returns an array of booleans (true = heads).
function flip(n, rng) { const out = new Array(n); for (let i = 0; i < n; i++) out[i] = rng() < 0.5; return out; }
// Band for the share of heads with n fair coins: 1/2 ± k·σ, σ = 1/(2√n), clipped to [0, 1].
// k = 1: about 68 of every 100 flips land inside; k = 2: about 95.
function band(n, k) { const h = k / (2 * Math.sqrt(n)); return [Math.max(0, 0.5 - h), Math.min(1, 0.5 + h)]; }
// The counts one run sweeps: every count from 1 to 1,000, one coin added at a time.
function sweep(max = 1000) { return Array.from({ length: max }, (_, i) => i + 1); }
</script>
<script>
(()=>{
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mc=document.getElementById('model'),cc=document.getElementById('chart'),mx=mc.getContext('2d'),cx=cc.getContext('2d');
const statusEl=document.querySelector('.ul-status'),valsEl=document.getElementById('vals'),key=document.querySelector('.key');
const btn=a=>document.querySelector(`[data-a=${a}]`);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=(Date.now()%2147483646)+1;const rng=()=>(seed=seed*16807%2147483647)/2147483647;
const MAX=[200,500,1000].includes(+location.hash.slice(1))?+location.hash.slice(1):200,COUNTS=sweep(MAX);
// Pace: the first flips are slow (one flip, one visible step), then the run speeds up.
const FAST=5000/MAX,delay=()=>FAST;
// Ideas arrive one at a time: one coin -> one run -> runs repeat -> the predicted bands.
const SAY={
 start:'One coin. Flip it.',
 one:'One coin lands all heads or all tails, so the dot sits at 1 or at 0. The dot marks the share of heads. Now add a coin.',
 two:'Two coins, one dot: across for how many coins, up for the share of heads. Add another.',
 more:'One more coin, one more dot.',
 ready:'You get the idea. Add coins one at a time, or let it run.',
 running:'Each dot is one flip of that many coins: how many coins across, the share of heads up.',
 run1:'Few coins: almost anything can happen. Many coins: close to half every time.',
 runN:'New flips, same shape. Chance on its own is wild; in bulk it keeps a pattern.',
 band:'The math drew these bands before any coin was flipped. Most dots land in them, and they narrow as coins are added.'};
let coins,dots,runs,running,showBand,say,stepN=1;const STEP_UNTIL=5;
function reset(){xMax=10;coins=[false];coins.unflipped=true;dots=[];runs=0;running=null;showBand=false;say=SAY.start;
 btn('one').hidden=false;btn('add').hidden=true;btn('run').hidden=true;stepN=1;btn('band').hidden=true;key.hidden=true;btn('run').textContent=`Run: 1 to ${MAX.toLocaleString()} coins`;draw();}
function setFlip(n){coins=flip(n,rng);const s=coins.filter(Boolean).length/n;dots.push([n,s]);}
document.querySelector('.ul-controls').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a||running)return;
 if(a==='one'){setFlip(1);animateFlip();say=SAY.one;btn('one').hidden=true;btn('add').hidden=false;stepLabel();}
 if(a==='add'){stepN++;setFlip(stepN);animateFlip();stepLabel();if(stepN>xMax)zoomTo(Math.min(MAX,NICE.find(v=>v>=stepN)));say=stepN===2?SAY.two:stepN<STEP_UNTIL?SAY.more:SAY.ready;
  if(stepN>=STEP_UNTIL)btn('run').hidden=false;}
 if(a==='run')startRun();
 if(a==='band'){showBand=true;btn('band').hidden=true;key.hidden=false;say=SAY.band;}
 if(a==='reset')reset();
 draw();});
function startRun(){stepped=false;
 if(xMax<MAX){const from=xMax,t0=performance.now();btn('run').disabled=true;btn('add').hidden=true;say='Zooming out to '+MAX+' coins…';
  const z=now=>{const p=Math.min(1,(now-t0)/900),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;xMax=from+(MAX-from)*e;draw(now);if(p<1)requestAnimationFrame(z);else{xMax=MAX;startRun();}};
  if(reduced){xMax=MAX;}else{requestAnimationFrame(z);return;}}say=SAY.running;btn('run').disabled=true;
 if(reduced){for(const n of COUNTS.slice(runs===0?stepN:0))setFlip(n);endRun();return;}
 running={i:runs===0?stepN:0,next:performance.now()};btn('add').hidden=true;requestAnimationFrame(tick);}
let last=null,stepped=false,xMax=10;
const DOT_R=3,DOT_A=.45;
const NICE=[10,20,50,100,200,500,1000];
function zoomTo(to,then){const from=xMax,t0=performance.now();if(reduced||from===to){xMax=to;draw();then&&then();return;}
 const z=now=>{const p=Math.min(1,(now-t0)/700),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;xMax=from+(to-from)*e;draw(now);if(p<1)requestAnimationFrame(z);else{xMax=to;draw();then&&then();}};requestAnimationFrame(z);}function stepLabel(){stepped=true;}
function tick(now){if(!running)return;
 while(running.i<COUNTS.length&&now>=running.next){const n=COUNTS[running.i++];setFlip(n);running.next+=delay(n);last={n,t:now,d:delay(n)};}
 draw(now);if(running.i<COUNTS.length||now-last.t<last.d)requestAnimationFrame(tick);else endRun();}
function endRun(){running=null;last=null;runs++;btn('run').disabled=false;btn('run').textContent='Run again';
 say=runs===1?SAY.run1:SAY.runN;if(runs>=2&&!showBand)btn('band').hidden=false;draw();}
// ---- layout
function layout(){const dpr=Math.min(2,devicePixelRatio||1),phone=innerWidth<=640;
 for(const[c,ctx,ar]of[[mc,mx,phone?0.55:0.8],[cc,cx,phone?0.6:0.8]]){const w=c.clientWidth,h=Math.round(w*ar);c.style.height=h+'px';c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);c._w=w;c._h=h;}
 draw();}
function cell(N,W,H){let c=Math.sqrt(W*H/N);while(Math.floor(W/c)*Math.floor(H/c)<N)c*=0.97;return c;}
function pile(N,x0,W,bot,c){const cols=Math.max(1,Math.floor(W/c)),out=[];for(let i=0;i<N;i++){const r=Math.floor(i/cols),k=i%cols;out.push([x0+(W-cols*c)/2+c*(k+.5),bot-c*(r+.5)]);}return out;}
function draw(now){if(!flipAnim)drawModel();drawChart(now);if(statusEl.textContent!==say)statusEl.textContent=say;
 const h=coins.filter(Boolean).length;valsEl.textContent=coins.unflipped?'One coin, not flipped yet.':`Latest flip: ${coins.length} coins, heads ${h}, tails ${coins.length-h}. ${dots.length} dots on the chart.`;}
// The model: coins start as one group, spin, then each flies into its bin: heads left, tails right.
let flipAnim=null;const FLIP_MS=1100;
function animateFlip(){if(reduced)return;flipAnim={t0:performance.now()};const f=now=>{if(!flipAnim)return;drawModel(now);drawChart(now);if(now-flipAnim.t0<FLIP_MS)requestAnimationFrame(f);else{flipAnim=null;draw(performance.now());}};requestAnimationFrame(f);}
function drawModel(now){const W=mc._w,H=mc._h,ink=css('--ul-ink'),grey=css('--ul-grey'),rule=css('--ul-rule');mx.clearRect(0,0,W,H);
 const N=coins.length,top=8,bot=H-34,gap=14,half=(W-gap)/2,binTop=top+(bot-top)*0.3;
 const c=cell(Math.max(N,1),half-8,bot-binTop-4),r=Math.min(10,c*0.36);
 // the two bins: open-topped boxes
 mx.strokeStyle=rule;mx.lineWidth=1.25;
 for(const x0 of[0,W-half]){mx.beginPath();mx.moveTo(x0+1,binTop);mx.lineTo(x0+1,bot);mx.lineTo(x0+half-1,bot);mx.lineTo(x0+half-1,binTop);mx.stroke();}
 mx.font='15px '+css('--ul-sans');mx.fillStyle=grey;mx.textAlign='center';mx.textBaseline='alphabetic';
const hn=coins.filter(Boolean).length,landed=!(flipAnim&&now&&now-flipAnim.t0<FLIP_MS);
 mx.fillText(coins.unflipped||!landed?'heads':'heads '+hn.toLocaleString(),half/2,H-10);mx.fillText(coins.unflipped||!landed?'tails':'tails '+(N-hn).toLocaleString(),W-half/2,H-10);
 mx.lineWidth=Math.max(.8,Math.min(1.75,r*0.35));
 if(coins.unflipped){mx.strokeStyle=grey;mx.beginPath();mx.arc(W/2,top+r+4,r,0,7);mx.stroke();return;}
 const p=flipAnim&&now?Math.min(1,(now-flipAnim.t0)/FLIP_MS):1;
 const hs=pile(hn,4,half-8,bot-2,c),ts=pile(N-hn,W-half+4,half-8,bot-2,c);
 // start: one row (or block) of coins above the bins, centred
 const sc=Math.min(2.6*r,cell(N,W*0.9,binTop-top-6)),sw=Math.min(W*0.9,N*sc);
 const start=pile(N,(W-sw)/2,sw,binTop-4,sc);
 let ih=0,it=0;
 coins.forEach((h,i)=>{const to=h?hs[ih++]:ts[it++],fr=start[i];
  const fly=Math.max(0,Math.min(1,(p-0.4)/0.6)),e=fly<.5?2*fly*fly:1-Math.pow(-2*fly+2,2)/2;
  const lift=Math.sin(Math.PI*e)*18;
  const x=fr[0]+(to[0]-fr[0])*e,y=fr[1]+(to[1]-fr[1])*e-lift;
  const rr=Math.min(r,sc*0.38),rad=rr+(r-rr)*e;
  const spinning=p<0.4,squash=spinning?Math.abs(Math.cos(p/0.4*Math.PI*3)):1;
  mx.beginPath();mx.ellipse(x,y,Math.max(.6,rad*squash),rad,0,0,7);
  if(spinning){mx.strokeStyle=grey;mx.stroke();}else if(h){mx.fillStyle=ink;mx.fill();}else{mx.strokeStyle=ink;mx.stroke();}});}
function drawChart(now){const W=cc._w,H=cc._h,grey=css('--ul-grey'),ghost=css('--ul-ghost'),rule=css('--ul-rule'),acc=css('--ul-accent');cx.clearRect(0,0,W,H);
 const L=40,R=W-10,T=22,B=H-30,X=v=>L+(v-1)/(xMax-1)*(R-L),Y=s=>B-s*(B-T);
 // bands (only once revealed): light = about 95 in 100, dark = about 68 in 100
 if(showBand){for(const[k,a]of[[2,.16],[1,.3]]){cx.fillStyle=ghost;cx.globalAlpha=a;cx.beginPath();
   for(let v=1;v<=xMax;v++){v>1?cx.lineTo(X(v),Y(band(v,k)[1])):cx.moveTo(X(v),Y(band(v,k)[1]));}
   for(let v=Math.floor(xMax);v>=1;v--){cx.lineTo(X(v),Y(band(v,k)[0]));}cx.closePath();cx.fill();}cx.globalAlpha=1;}
 cx.strokeStyle=rule;cx.lineWidth=1;cx.beginPath();cx.moveTo(L,B);cx.lineTo(R,B);cx.stroke();
 cx.strokeStyle=ghost;cx.lineWidth=1.25;cx.beginPath();cx.moveTo(L,Y(.5));cx.lineTo(R,Y(.5));cx.stroke();
 cx.font='italic 15px '+css('--ul-serif');cx.fillStyle=grey;cx.textBaseline='middle';cx.textAlign='right';
 cx.fillText('1',L-8,Y(1));cx.fillText('½',L-8,Y(.5));cx.fillText('0',L-8,Y(0));
 cx.textAlign='left';cx.textBaseline='alphabetic';cx.fillText('share of heads',L,T-8);
 cx.fillText('1 coin',L,H-8);cx.textAlign='center';cx.fillText((xMax/2).toLocaleString(),X(xMax/2),H-8);cx.textAlign='right';cx.fillText(Math.round(xMax).toLocaleString()+' coins',R,H-8);
 // dots: each at its exact count; repeats overlap and darken
 const rr=DOT_R;cx.fillStyle=acc;cx.globalAlpha=DOT_A;
 const shown=flipAnim?dots.slice(0,-1):dots;for(const[v,s]of shown){if(v>xMax)continue;cx.beginPath();cx.arc(X(v),Y(s),rr,0,7);cx.fill();}cx.globalAlpha=1;
 // band edges drawn over the dots, so they stay visible where dots pile up
 if(showBand){for(const[k,c]of[[1,grey],[2,ghost]])for(const e of[0,1]){cx.strokeStyle=c;cx.lineWidth=1;cx.beginPath();for(let v=1;v<=xMax;v++){const y=Y(band(v,k)[e]);v>1?cx.lineTo(X(v),y):cx.moveTo(X(v),y);}cx.stroke();}}
 // the newest dot, while the run is slow: a ring, a guide down to its count, and words saying what it is
 if(((last&&now&&last.d>=250)||(stepped&&!running))&&dots.length&&!flipAnim){if(!last||!now){now=performance.now();last={t:now-1e4,d:1e4};}const[v,sv]=dots[dots.length-1],x=X(v),y=Y(sv),age=Math.min(1,(now-last.t)/Math.min(500,last.d));
  cx.strokeStyle=acc;cx.globalAlpha=1-age;cx.lineWidth=1.5;cx.beginPath();cx.arc(x,y,4+10*age,0,7);cx.stroke();cx.globalAlpha=1;
  
  cx.strokeStyle=rule;cx.setLineDash([2,3]);cx.beginPath();cx.moveTo(x,y+6);cx.lineTo(x,B);cx.stroke();cx.setLineDash([]);
  const h=Math.round(sv*v);cx.font='italic 15px '+css('--ul-serif');cx.fillStyle=grey;const lft=x>R-130;cx.textAlign=lft?'right':'left';cx.textBaseline='middle';
  cx.fillText(`${v} ${v>1?'coins':'coin'}, ${h} ${h===1?'head':'heads'}`,lft?x-12:x+12,Math.abs(y-Y(.5))<12?y+(sv<.5?14:-14):y);}}
addEventListener('resize',layout);
document.getElementById('k1').style.background=`color-mix(in srgb, ${css('--ul-ghost')} 30%, ${css('--ul-paper')})`;
document.getElementById('k2').style.background=`color-mix(in srgb, ${css('--ul-ghost')} 16%, ${css('--ul-paper')})`;
reset();layout();
})();
</script></body></html>
