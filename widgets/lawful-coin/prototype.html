<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Lawful Coin — prototype v4</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ul-paper:#fffff8;--ul-ink:#111111;--ul-grey:#5f646a;--ul-ghost:#a3a8ad;--ul-rule:#d3d6d1;--ul-accent:#b4501a;--ul-line:1.75;--ul-trail:.55;
 --ul-serif:'EB Garamond',Garamond,Georgia,serif;--ul-sans:'Source Sans 3',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--ul-paper:#151513;--ul-ink:#e8e6de;--ul-grey:#a9aeb4;--ul-ghost:#6f757c;--ul-rule:#474c52;--ul-accent:#f08a4b}}
body{margin:0;background:var(--ul-paper);color:var(--ul-ink);font-family:var(--ul-serif);font-size:19px}
main{max-width:780px;margin:0 auto;padding:22px 16px}
.ul-invite{font-style:italic;margin:0 0 .5rem}
.ul-status{font-style:italic;min-height:3em;margin:.5rem 0 .25rem}
canvas{display:block;width:100%}
.fig{display:flex;gap:0;align-items:flex-start}
.fig>div:first-child{flex:0 0 30%}
.fig>div{flex:1 1 0;min-width:0}
@media(max-width:640px){.fig{flex-direction:column;gap:0}.fig>div:first-child{flex:none;width:100%}}
canvas:focus-visible{outline:2px solid var(--ul-accent);outline-offset:4px}
.ul-controls{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-top:.5rem;font-family:var(--ul-sans);font-size:1rem}
.ul-btn{min-height:44px;min-width:44px;padding:0 1rem;font:inherit;font-family:var(--ul-sans);color:var(--ul-ink);background:transparent;border:1.5px solid currentColor;border-radius:6px;cursor:pointer}
.ul-btn[aria-pressed="true"]{background:var(--ul-ink);color:var(--ul-paper)}
.ul-btn-quiet{border-color:transparent;text-decoration:underline;text-underline-offset:.2em;padding:0 .5rem}
.ul-btn[hidden]{display:none}
.ul-btn:focus-visible{outline:2px solid var(--ul-accent);outline-offset:3px}
.sr{position:absolute;left:-9999px}
.key{display:flex;gap:.2rem 1.2rem;flex-wrap:wrap;font-family:var(--ul-sans);font-size:.85rem;color:var(--ul-grey);margin:.2rem 0 0 40px}
.key span{display:inline-flex;align-items:center;gap:.4rem}.key i{display:inline-block;width:14px;height:10px}
.key[hidden]{display:none}
</style></head><body><main>
<p class="ul-invite">Flip coins. Watch the divider, the pointer and the pen.</p>
<div class="fig">
 <div><canvas id="model" role="img" aria-label="The coins of the latest flip, heads (filled) on one side of an orange divider, tails (open) on the other. The divider sits at the share of heads."></canvas></div>
 <div><canvas id="chart" role="img" aria-label="The share of heads traced as coins are added."></canvas>
  <div class="key" hidden><span><i id="k1"></i>inner band: about 68 of every 100 flips</span><span><i id="k2"></i>outer band: about 95 of every 100</span></div></div>
</div>
<p class="ul-status" aria-live="polite"></p>
<div class="ul-controls">
 <button class="ul-btn" data-a="add">Flip one coin</button>
 <button class="ul-btn" data-a="run" hidden>Run: up to 10,000 coins</button>
 <button class="ul-btn ul-btn-quiet" data-a="band" hidden>Show the expected range</button>
 <button class="ul-btn ul-btn-quiet" data-a="reset">Reset</button>
</div>
<p class="sr" id="vals"></p>
</main>
<script>// Coins engine (Ch1 §5a The Lawful Coin). Fair coins; no drawing.
// Flip n fair coins: returns an array of booleans (true = heads).
function flip(n, rng) { const out = new Array(n); for (let i = 0; i < n; i++) out[i] = rng() < 0.5; return out; }
// Band for the share of heads with n fair coins: 1/2 ± k·σ, σ = 1/(2√n), clipped to [0, 1].
// k = 1: about 68 of every 100 flips land inside; k = 2: about 95.
function band(n, k) { const h = k / (2 * Math.sqrt(n)); return [Math.max(0, 0.5 - h), Math.min(1, 0.5 + h)]; }
// The counts one run sweeps: every count from 1 to 1,000, one coin added at a time.
function sweep(max = 1000) { return Array.from({ length: max }, (_, i) => i + 1); }
</script>
<script>
(()=>{
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mc=document.getElementById('model'),cc=document.getElementById('chart'),mx=mc.getContext('2d'),cx=cc.getContext('2d');
const statusEl=document.querySelector('.ul-status'),valsEl=document.getElementById('vals'),key=document.querySelector('.key');
const btn=a=>document.querySelector(`[data-a=${a}]`);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=(Date.now()%2147483646)+1;const rng=()=>(seed=seed*16807%2147483647)/2147483647;
const MAX=10000,DRAWN=400,RUN_S=20,FLIP_MS=900,NICE=[10,100,1000,10000],STEP_UNTIL=5;
const SAY={
 start:'One coin. Flip it.',
 one:'One coin: all heads or all tails, so the divider jumps to the top or the bottom. Its position is the share of heads. Add a coin.',
 two:'The line traces the divider: across for how many coins, up for the share of heads. Add another.',
 more:'One more coin, one more flip.',
 ready:'You get the idea. Add coins one at a time, or let it run.',
 running:'More and more coins, flipped again and again. Watch the divider, the pointer and the pen: they swing, then settle on one half.',
 run1:'Few coins: the split swings wildly. Thousands: it holds near one half. Does the math predict this shape?',
 runN:'A new run, the same shape. Each flip is random; the split is lawful.',
 band:'The bands are what the math predicts, before any coin is flipped: about 68 of every 100 flips land in the inner band, about 95 in the outer. Both narrow as coins are added.'};
let N,heads,share,trace,old,runs,mode,showBand,say,xMax,bandT0,run,flipT0,raf=0,onScreen=true;
function reset(){N=0;heads=0;share=.5;trace=[];old=[];runs=0;mode='idle';showBand=false;say=SAY.start;xMax=10;bandT0=0;run=null;flipT0=-1e9;
 btn('add').hidden=false;btn('add').textContent='Flip one coin';btn('run').hidden=true;btn('band').hidden=true;key.hidden=true;btn('run').textContent='Run: up to 10,000 coins';draw(performance.now());}
function flipAll(){const f=flip(N,rng);heads=f.filter(Boolean).length;share=heads/N;trace.push(N,share);}
function zoomTo(to){const from=xMax,t0=performance.now();if(reduced||from===to){xMax=to;return;}
 const z=now=>{const p=Math.min(1,(now-t0)/800),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;xMax=from+(to-from)*e;if(p<1)requestAnimationFrame(z);else xMax=to;};requestAnimationFrame(z);}
function grow(n){N=n;const to=NICE.find(v=>v>=N)||MAX;if(to>xMax)zoomTo(to);}
document.querySelector('.ul-controls').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
 if(a==='add'&&mode==='idle'){grow(N+1);flipAll();flipT0=reduced?-1e9:performance.now();btn('add').textContent='Add a coin and flip';
  say=N===1?SAY.one:N===2?SAY.two:N<STEP_UNTIL?SAY.more:SAY.ready;if(N>=STEP_UNTIL)btn('run').hidden=false;}
 if(a==='run'&&mode==='idle'){if(runs>0){old.push(trace);trace=[];N=0;xMax=10;}if(!N)grow(1);
  mode='run';run={t0:performance.now(),n0:N};say=SAY.running;btn('add').hidden=true;btn('run').disabled=true;}
 if(a==='band'){showBand=true;bandT0=performance.now();btn('band').hidden=true;key.hidden=false;say=SAY.band;}
 if(a==='reset')reset();
 loop();});
function endRun(){mode='idle';runs++;run=null;btn('run').disabled=false;btn('run').textContent='Run again';say=runs===1?SAY.run1:SAY.runN;if(!showBand)btn('band').hidden=false;}
function loop(){if(!raf&&onScreen&&!document.hidden)raf=requestAnimationFrame(frame);}
new IntersectionObserver(es=>{onScreen=es[0].isIntersecting;if(onScreen)loop();}).observe(mc);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loop();});
function frame(now){raf=0;
 if(run){const p=Math.min(1,(now-run.t0)/1000/RUN_S),n=Math.round(run.n0*Math.pow(MAX/run.n0,p));if(n!==N||p>=1){grow(n);flipAll();}if(p>=1)endRun();}
 if(reduced&&run){while(run){const n=Math.min(MAX,Math.ceil(N*1.03)+1);grow(n);flipAll();if(n>=MAX)endRun();}}
 draw(now);if(run||now-flipT0<FLIP_MS||now-bandT0<900)loop();}
// ---- layout: one value axis (share of heads) shared by the divider, the pointer and the pen
let A={};
function layout(){const dpr=Math.min(2,devicePixelRatio||1),phone=innerWidth<=640;
 const W1=mc.clientWidth,W2=cc.clientWidth;
 const H1=phone?Math.round(W1*0.36):Math.max(300,Math.round(W1*1.25)),H2=phone?Math.round(W2*0.78):H1;
 for(const[c,ctx,w,h]of[[mc,mx,W1,H1],[cc,cx,W2,H2]]){c.style.height=h+'px';c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);c._w=w;c._h=h;}
 A=phone?{phone,v0:Math.round(W1*0.06),v1:W1-64}:{phone,v0:Math.round(H1*0.88),v1:70};
 draw(performance.now());}
const V=v=>A.v0+v*(A.v1-A.v0);
function draw(now){drawModel(now);drawChart(now);if(statusEl.textContent!==say)statusEl.textContent=say;
 valsEl.textContent=N?`${N.toLocaleString()} coins: heads ${heads.toLocaleString()}, tails ${(N-heads).toLocaleString()}; share of heads ${share.toFixed(3)}.`:'No coins yet.';}
// The model: the coins of the latest flip, heads on one side of the divider and tails on the other.
// The divider sits at the share of heads, on the same axis as the pointer and the pen.
function drawModel(now){const W=mc._w,H=mc._h,ink=css('--ul-ink'),grey=css('--ul-grey'),rule=css('--ul-rule'),acc=css('--ul-accent');mx.clearRect(0,0,W,H);
 if(!N){mx.font='italic 14px '+css('--ul-serif');mx.fillStyle=grey;mx.fillText('no coins yet',8,20);return;}
 const k=Math.min(N,DRAWN),kh=Math.round(k*heads/N),p=V(share);
 const age=(now-flipT0)/FLIP_MS,spin=age<0.45,fly=Math.max(0,Math.min(1,(age-0.45)/0.55)),e=fly<.5?2*fly*fly:1-Math.pow(-2*fly+2,2)/2;
 // the frame: the full range of the share, 0 to 1
 let x0,x1,y0,y1;if(!A.phone){x0=6;x1=W-6;y0=V(1);y1=V(0);}else{x0=V(0);x1=V(1);y0=24;y1=H-6;}
 mx.strokeStyle=rule;mx.lineWidth=1.75;mx.strokeRect(x0,y0,x1-x0,y1-y0);
 // coin positions: a stable grid inside each region
 const r=Math.max(1.4,Math.min(9,Math.sqrt((x1-x0)*(y1-y0)/Math.max(k,1))*0.32));
 const place=(i,count,a,b)=>{// region along the value axis from a to b (px); fill a grid
  const across=A.phone?(y1-y0):(x1-x0),along=Math.abs(b-a),c=Math.max(2*r+1,Math.sqrt(across*along/Math.max(count,1)));
  const cols=Math.max(1,Math.floor(across/c)),row=Math.floor(i/cols),col=i%cols,off=(across-cols*c)/2+c*(col+.5),d=c*(row+.5);
  const t=a+Math.sign(b-a)*Math.min(d,along-r);return A.phone?[t,y0+off]:[x0+off,t];};
 const mid=A.phone?[(x0+x1)/2,(y0+y1)/2]:[(x0+x1)/2,(y0+y1)/2];
 for(let i=0;i<k;i++){const h=i<kh;const to=h?place(i,kh,V(0),p):place(i-kh,k-kh,V(1),p);
  const fr=[mid[0]+(i%20-9.5)*r*2.3*(A.phone?1:1),mid[1]+(Math.floor(i/20)-k/40)*r*2.3];
  const q=age<1&&N<=60?[fr[0]+(to[0]-fr[0])*e,fr[1]+(to[1]-fr[1])*e]:to;
  const sq=spin&&N<=60?Math.abs(Math.cos(age/0.45*Math.PI*3)):1;
  mx.beginPath();mx.ellipse(q[0],q[1],Math.max(.5,r*sq),r,0,0,7);
  if(spin&&N<=60){mx.strokeStyle=grey;mx.lineWidth=1;mx.stroke();}else if(h){mx.fillStyle=ink;mx.fill();}else{mx.strokeStyle=ink;mx.lineWidth=Math.max(.8,r*.3);mx.stroke();}}
 // the divider (accent), only once the coins have landed
 if(!(spin&&N<=60)){mx.strokeStyle=acc;mx.lineWidth=3;mx.beginPath();if(!A.phone){mx.moveTo(x0,p);mx.lineTo(x1,p);}else{mx.moveTo(p,y0);mx.lineTo(p,y1);}mx.stroke();
  mx.strokeStyle=acc;mx.globalAlpha=.35;mx.lineWidth=1;mx.setLineDash([2,4]);mx.beginPath();if(!A.phone){mx.moveTo(x1,p);mx.lineTo(W,p);}else{mx.moveTo(p,y1);mx.lineTo(p,H);}mx.stroke();mx.setLineDash([]);mx.globalAlpha=1;}
 mx.font='italic 14px '+css('--ul-serif');mx.fillStyle=grey;mx.textBaseline='alphabetic';
 if(!A.phone){mx.textAlign='left';mx.fillText(N>DRAWN?`${N.toLocaleString()} coins (${DRAWN} drawn)`:`${N} coin${N===1?'':'s'}`,6,y0-10);}
 else{mx.textAlign='left';mx.fillText(N>DRAWN?`${N.toLocaleString()} coins (${DRAWN} drawn)`:`${N} coin${N===1?'':'s'}`,x0,15);mx.textAlign='right';mx.fillText('heads | tails',x1,15);}}
function drawChart(now){const W=cc._w,H=cc._h,grey=css('--ul-grey'),ghost=css('--ul-ghost'),rule=css('--ul-rule'),acc=css('--ul-accent');cx.clearRect(0,0,W,H);
 let P,c0,c1;
 if(!A.phone){c0=44;c1=W-10;P=(n,v)=>[c0+(n-1)/(xMax-1)*(c1-c0),V(v)];}
 else{c0=26;c1=H-30;P=(n,v)=>[V(v),c0+(n-1)/(xMax-1)*(c1-c0)];}
 const bx=[];for(let i=0;i<=240;i++)bx.push(Math.max(1,(xMax)*Math.pow(i/240,2)));   // dense near 1, where the bands change fast
 const poly=(k,e)=>bx.map(n=>P(n,band(n,k)[e]));
 if(showBand){const fade=reduced?1:Math.min(1,(now-bandT0)/900);
  for(const[k,a]of[[2,.22],[1,.4]]){cx.fillStyle=ghost;cx.globalAlpha=a*fade;cx.beginPath();
   [...poly(k,1),...poly(k,0).reverse()].forEach((q,i)=>i?cx.lineTo(...q):cx.moveTo(...q));cx.closePath();cx.fill();}cx.globalAlpha=1;}
 cx.strokeStyle=rule;cx.lineWidth=1;cx.beginPath();cx.moveTo(...P(1,1));cx.lineTo(...P(1,0));cx.lineTo(...P(xMax,0));cx.stroke();
 cx.strokeStyle=ghost;cx.lineWidth=1.25;cx.beginPath();cx.moveTo(...P(1,.5));cx.lineTo(...P(xMax,.5));cx.stroke();
 cx.font='italic 15px '+css('--ul-serif');cx.fillStyle=grey;
 if(!A.phone){cx.textBaseline='middle';cx.textAlign='right';for(const[v,t]of[[0,'0'],[.5,'½'],[1,'1']])cx.fillText(t,c0-14,V(v));
  cx.textAlign='left';cx.textBaseline='alphabetic';cx.fillText('share of heads',c0,V(1)-10);
  const yl=V(0)+22;cx.fillText('1',c0,yl);cx.textAlign='center';cx.fillText(Math.round(xMax/2).toLocaleString(),(c0+c1)/2,yl);cx.textAlign='right';cx.fillText(Math.round(xMax).toLocaleString()+' coins',c1,yl);}
 else{cx.textBaseline='alphabetic';cx.textAlign='center';for(const[v,t]of[[0,'0'],[.5,'½'],[1,'1']])cx.fillText(t,V(v),c0-12);
  cx.textAlign='left';cx.textBaseline='middle';const lx=V(1)+8;cx.fillText('1',lx,c0);cx.fillText(Math.round(xMax/2).toLocaleString(),lx,(c0+c1)/2);cx.fillText(Math.round(xMax).toLocaleString(),lx,c1);
  cx.textBaseline='alphabetic';cx.fillText('coins',lx,c1+22);cx.textAlign='left';cx.fillText('share of heads →',V(0),H-4);}
 const line=(tr,alpha)=>{if(tr.length<4)return;cx.strokeStyle=acc;cx.globalAlpha=alpha;cx.lineWidth=1.25;cx.lineJoin='round';cx.beginPath();
  for(let i=0;i<tr.length;i+=2){const q=P(tr[i],tr[i+1]);i?cx.lineTo(...q):cx.moveTo(...q);}cx.stroke();cx.globalAlpha=1;};
 cx.save();cx.beginPath();if(!A.phone)cx.rect(c0,V(1)-4,c1-c0+4,V(0)-V(1)+8);else cx.rect(V(0)-4,c0,V(1)-V(0)+8,c1-c0+4);cx.clip();
 for(const o of old)line(o,.25);line(trace,.85);
 const landed=!(now-flipT0<FLIP_MS*0.45&&N<=60);
 if(trace.length>=2&&landed){const q=P(trace[trace.length-2],trace[trace.length-1]);cx.fillStyle=acc;cx.beginPath();cx.arc(q[0],q[1],4.5,0,7);cx.fill();}
 cx.restore();
 if(showBand)for(const[k,c]of[[1,grey],[2,ghost]])for(const e of[0,1]){cx.strokeStyle=c;cx.lineWidth=1;cx.beginPath();poly(k,e).forEach((q,i)=>i?cx.lineTo(...q):cx.moveTo(...q));cx.stroke();}
 if(N&&landed){const v=V(share);cx.fillStyle=acc;cx.beginPath();
  if(!A.phone){cx.moveTo(c0-1,v);cx.lineTo(c0-11,v-5);cx.lineTo(c0-11,v+5);}else{cx.moveTo(v,c0-1);cx.lineTo(v-5,c0-11);cx.lineTo(v+5,c0-11);}
  cx.closePath();cx.fill();}}
addEventListener('resize',layout);
document.getElementById('k1').style.background=`color-mix(in srgb, ${css('--ul-ghost')} 40%, ${css('--ul-paper')})`;
document.getElementById('k2').style.background=`color-mix(in srgb, ${css('--ul-ghost')} 22%, ${css('--ul-paper')})`;
reset();layout();
})();
</script></body></html>
