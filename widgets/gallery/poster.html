<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster renderer</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../core/tokens.css">
<!-- Used by tools/posters.mjs: poster.html?widget=trisolaran-sky&theme=dark
     draws widgets/<widget>/poster.js with the design tokens of that theme. -->
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { readColors } from '../core/core.js';
  const q = new URLSearchParams(location.search);
  const name = q.get('widget'), theme = q.get('theme') || 'light';
  document.body.className = theme === 'dark' ? 'quarto-dark' : 'quarto-light';
  const mod = await import(`../${name}/poster.js`);
  await document.fonts.ready;
  const { width, height } = mod.size, dpr = 2, cv = document.getElementById('c');
  cv.width = width * dpr; cv.height = height * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  mod.drawPoster(ctx, readColors(document.body), mod.size);
  window.poster = { png: cv.toDataURL('image/png') };
</script>
</body>
</html>
