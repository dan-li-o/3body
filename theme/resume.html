<!-- Pick up where you left off (Dan, 2026-11-25: "some kind of book mark function so that users can get
     back to where they were reading next time. This is especially helpful on phone screens").
     The book remembers, in this browser only (localStorage; nothing is sent anywhere), the paragraph
     you were last reading on each page, and the last page you read. Coming back, a quiet line at the
     bottom offers to take you there; on the front page it offers the page you were reading. It never
     jumps by itself, and it goes away as soon as you scroll on, tap it, or close it. -->
<script>
(function () {
  var KEY = 'ul-place', MAX_PAGES = 40, store;
  try { store = window.localStorage; store.getItem(KEY); } catch (e) { return; }   // storage off: no bookmark
  var main = document.querySelector('main#quarto-document-content') || document.querySelector('main');
  if (!main) return;
  var path = location.pathname.replace(/index\.html$/, '');
  var front = !!document.querySelector('meta[name="ul-front"]') || /\/(3body\/)?$/.test(path);
  var BLOCKS = 'p, li, blockquote, h2, h3, .ul-widget, figure, .callout';

  function read() { try { return JSON.parse(store.getItem(KEY)) || { pages: {} }; } catch (e) { return { pages: {} }; } }
  function write(d) { try { store.setItem(KEY, JSON.stringify(d)); } catch (e) { /* full or off: fine */ } }
  var clean = function (t) { return (t || '').replace(/\s+/g, ' ').trim(); };

  // The place: the section (Quarto wraps each in <section id>) and the k-th block in it.
  function sectionOf(el) { return el.closest('section[id]'); }
  function heading(sec) { var h = sec && sec.querySelector('h2, h3'); return h ? clean(h.textContent) : ''; }
  function here() {
    var top = 70, blocks = main.querySelectorAll(BLOCKS);
    for (var i = 0; i < blocks.length; i++) {
      var r = blocks[i].getBoundingClientRect();
      if (r.bottom > top && r.height > 0) {
        var sec = sectionOf(blocks[i]);
        var inSec = sec ? Array.prototype.indexOf.call(sec.querySelectorAll(BLOCKS), blocks[i]) : i;
        return { sec: sec ? sec.id : '', k: inSec, label: heading(sec), y: window.scrollY };
      }
    }
    return null;
  }
  function save() {
    var p = here(); if (!p) return;
    var d = read(); d.pages = d.pages || {};
    if (p.y < 200) { delete d.pages[path]; } else { p.title = clean(document.title.split('–')[0]); p.at = Date.now(); d.pages[path] = p; d.last = path; }
    var keys = Object.keys(d.pages);
    if (keys.length > MAX_PAGES) keys.sort(function (a, b) { return d.pages[a].at - d.pages[b].at; }).slice(0, keys.length - MAX_PAGES).forEach(function (k) { delete d.pages[k]; });
    write(d);
  }
  function go(p) {
    var sec = p.sec && document.getElementById(p.sec), el = sec ? sec.querySelectorAll(BLOCKS)[p.k] || sec : null;
    if (!el) { window.scrollTo(0, p.y); return; }
    // Jump, then hold the place for a moment: widgets and images above it may still be settling to
    // their final height, which would push the paragraph away. Stop as soon as the reader scrolls.
    var stop = false, quit = function () { stop = true; };
    ['wheel', 'touchstart', 'keydown'].forEach(function (e) { window.addEventListener(e, quit, { once: true, passive: true }); });
    var fix = function () { if (!stop) { var off = el.getBoundingClientRect().top - 70; if (Math.abs(off) > 4) window.scrollTo(0, window.scrollY + off); } };
    fix(); [150, 400, 800, 1400, 2200].forEach(function (t) { setTimeout(fix, t); });
  }

  // The offer: one quiet line, bottom centre.
  function offer(text, onGo) {
    var bar = document.createElement('div'); bar.className = 'ul-resume'; bar.setAttribute('role', 'status');
    var b = document.createElement('button'); b.type = 'button'; b.className = 'ul-resume-go'; b.textContent = text;
    var x = document.createElement('button'); x.type = 'button'; x.className = 'ul-resume-x'; x.textContent = '×'; x.setAttribute('aria-label', 'Close');
    bar.append(b, x); document.body.appendChild(bar);
    var start = window.scrollY;
    function close() { bar.remove(); window.removeEventListener('scroll', onScroll); }
    function onScroll() { if (Math.abs(window.scrollY - start) > 400) close(); }
    b.addEventListener('click', function () { close(); onGo(); });
    x.addEventListener('click', close);
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  function init() {
    var d = read(), mine = d.pages && d.pages[path];
    if (location.hash === '#ul-resume' && mine) { history.replaceState(null, '', location.pathname); setTimeout(function () { go(mine); }, 50); }
    else if (!location.hash && mine && mine.y > window.innerHeight) offer(mine.label ? 'Continue: ' + mine.label : 'Continue where you left off', function () { go(mine); });
    else if (front && d.last && d.last !== path && d.pages[d.last]) {
      var p = d.pages[d.last];
      offer('Continue: ' + (p.label || p.title), function () { location.href = d.last + '#ul-resume'; });
    }
    var t = 0;
    window.addEventListener('scroll', function () { clearTimeout(t); t = setTimeout(save, 800); }, { passive: true });
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
