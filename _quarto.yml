project:
  type: book

resources: 
  - widgets/**
  - "!widgets/**/*.md"      # specs and README stay in the repo, not on the site
  - "!widgets/gallery/**"   # development pages (gallery, poster renderer, design dials)
  - "!widgets/**/poster.js" # draws the committed poster PNGs; not needed by readers
  - "!widgets/core/tuner.js"
  - css/**
  - assets/**

book:
  title: "Unlawful Laws"
  author: "Dan Li"
  subtitle: "How to Live with Scientific Uncertainties"
  description: "How to Live with Scientific Uncertainties"
  chapters:
    - index.qmd
    - intro.qmd

    - part: "Part I - When Laws Fail"
      chapters: 
        - chapters/part1/ch1_physics-never-existed.qmd
        - chapters/part1/ch2_induction-at-the-edge.qmd
        - chapters/part1/ch3_grue-machines-predictions.qmd

    - part: "Part II - Modeling the Unlawful"
      chapters: 
        - chapters/part2/ch4_false-heavens.qmd
        - chapters/part2/ch5_computability-and-chaos.qmd
        - chapters/part2/ch6-modeling-earth-climate.qmd

    - part: "Part III - Living Beyond Law"
      chapters:
        - chapters/part3/ch7_fragile-vs-antifragile.qmd
        - chapters/part3/ch8_defending-society.qmd
        - chapters/part3/ch9_strategies-for-uncertainty.qmd

    - data/references.qmd
  site-url: https://dan-li-o.github.io/3body
  favicon: assets/icons/favicon.svg
  image: assets/social-card.png
  open-graph:
    image: assets/social-card.png
    image-alt: "Three bodies tracing a tangle across the sky"
  twitter-card:
    card-style: summary_large_image
    image: assets/social-card.png
  repo-url: https://github.com/dan-li-o/3body
  language: en
  sidebar: 
    style: "floating"

format:
  html:
    theme:
      light: [cosmo, theme/book.scss, theme/light.scss]
      dark: [darkly, theme/book.scss, theme/dark.scss]
    fig-cap-location: margin       # Tufte: figure captions in the margin
    tbl-cap-location: margin
    html-math-method: katex
    toc: false                     # a book has no per-page contents box (Dan, 2026-11-20)
    number-sections: true
    code-copy: true
    css: 
      - assets/fonts/fonts.css
      - css/paper.css
    include-in-header:
      - text: |
          <!-- Paths start at the project root; Quarto rewrites them per page (so never prefix /3body). -->
          <link rel="icon" href="/assets/icons/favicon.ico" sizes="32x32">
          <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
          <link rel="preload" href="/assets/fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
          <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
          <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    include-after-body:
      - theme/lead-in.html
      - theme/quiet-page.html
      - text: |
          <!-- Hypothes.is annotation client -->
          <script async src="https://hypothes.is/embed.js"></script>

# TODOs stay in the files but not on the site (filters/hide-todo.lua; --profile draft shows them)
filters:
  - filters/hide-todo.lua

# Citations
bibliography: data/references.bib
# To get footnote-style citations, add a note-based CSL, e.g.:
# csl: data/chicago-note-bibliography.csl
link-citations: true
# citation-location supports only: document | margin (no footnote)
# Use a note-based CSL to render citations as footnotes instead.

crossref:
  custom:
    - kind: float
      reference-prefix: Widget
      key: wid
      caption-prefix: Widget
      caption-location: margin      # Tufte: number and caption in the margin (design.md)
      space-before-numbering: true

editor: 
  render-on-save: true
